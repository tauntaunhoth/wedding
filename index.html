<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katrina &amp; Matthew</title>
<meta name="description" content="The wedding of Katrina and Matthew.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D9D9D6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://weddingkatrina.matthewmacknamara.com/">
<meta property="og:title" content="Katrina &amp; Matthew">
<meta property="og:description" content="We don’t believe in signs. But we did the maths.">
<meta property="og:image" content="https://weddingkatrina.matthewmacknamara.com/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: 32px; background: #D9D9D6;
    background-image: radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 70%);
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; color: #1E2226;
  }
  .frame {
    position: fixed; inset: 18px; pointer-events: none;
    border: 2.4px solid #A7A8A9; outline: 0.9px solid #B9BCBF; outline-offset: -11px;
  }
  main { text-align: center; max-width: 560px; }
  .eyebrow { margin: 0 0 22px; padding-left: 0.4em; font-size: 12px; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase; color: #53565A; }
  h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(44px, 11vw, 76px); line-height: 1.05; }
  .rings { margin: 30px auto 26px; display: block; }
  .note { margin: 0 0 40px; font-size: 18px; font-weight: 300; line-height: 1.5; }
  .button {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px;
    color: #1E2226; text-decoration: none; border-bottom: 1px solid #75787B;
    font-size: 12px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
  }
  .button:hover, .button:focus-visible { color: #53565A; border-color: #1E2226; }
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<main>
  <p class="eyebrow">The wedding of</p>
  <h1>Katrina &amp; Matthew</h1>
  <svg class="rings" width="96" height="64" viewBox="0 0 120 80" role="img" aria-label="Two interlinked wedding rings">
    <defs><linearGradient id="r" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="110" y2="72"><stop offset="0" stop-color="#6B6F73"/><stop offset="0.3" stop-color="#F4F5F6"/><stop offset="0.5" stop-color="#9A9D9F"/><stop offset="0.72" stop-color="#FFFFFF"/><stop offset="1" stop-color="#75787B"/></linearGradient></defs>
    <g fill="none" stroke="url(#r)" stroke-width="5"><circle cx="45" cy="40" r="26"/><circle cx="75" cy="40" r="26"/><path d="M50 15.4 A26 26 0 0 1 68 27" stroke-linecap="butt"/></g>
  </svg>
  <p class="note">More details to come.</p>
  <a class="button" href="/savethedate/">Save the date</a>
</main>
</body>
</html>
